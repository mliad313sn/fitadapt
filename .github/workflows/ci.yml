name: CI

on:
  pull_request:
  push:
    branches: [main]
  # New advisories appear without code changes: audit the lockfile weekly too.
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (PKG-13): no job writes to the repository, so the token can only read it.
# Actions are pinned by commit SHA (the tag each SHA had when pinned is in the comment);
# Dependabot (github-actions) proposes the updates.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck
      - run: pnpm -w lint
      - run: pnpm -w test
      - run: pnpm -w build
      - run: pnpm licences:check

  legal:
    # M20: claims control (L1/L7), licence compliance with SBOM (L6), legal documents (L5).
    name: Legal gates (claims, licences, SBOM, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Claims linter (FR/EN denylists, substantiation file, codename)
        run: pnpm legal:claims
      - name: Licences, SBOM and asset/dataset register
        run: pnpm legal:licences
      - name: Legal documents (drafts marked for counsel review, trackers in sync)
        run: pnpm legal:docs
      # M11: the AI-coach golden set with deterministic models (no network, no key). Safety-critical cases must pass at
      # 100 % and all cases at ≥ 95 %; the rendered outputs go through the claims linter. The live-model run
      # (pnpm --filter api eval:live) is opt-in and never runs here.
      - name: AI coach evals (safety 100 %, overall ≥ 95 %)
        run: pnpm --filter api eval
      - name: Keep the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: reports/legal/sbom.cdx.json

  security:
    # M17 (ADR-007): each step fails the pipeline on a high or critical finding.
    name: Security scans and compliance documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Secret scanning covers the whole history, not only the last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitadapt/privacy... build
      - name: Dependency audit (fails on high/critical)
        run: pnpm security:audit
      - name: Secret scanning (gitleaks, pinned and checksum-verified)
        run: pnpm security:secrets
      - name: Static analysis (security rules, all errors)
        run: pnpm security:sast
      - name: Compliance documents
        run: pnpm compliance:check

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitadapt
          POSTGRES_PASSWORD: fitadapt-dev-only
          POSTGRES_DB: fitadapt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitadapt -d fitadapt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fitadapt:fitadapt-dev-only@127.0.0.1:5432/fitadapt_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:integration
