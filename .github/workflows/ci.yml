name: CI

on:
  pull_request:
  push:
    branches: [main]
  # New advisories appear without code changes: audit the lockfile weekly too.
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck
      - run: pnpm -w lint
      - run: pnpm -w test
      - run: pnpm -w build
      - run: pnpm licences:check

  security:
    # M17 (ADR-007): each step fails the pipeline on a high or critical finding.
    name: Security scans and compliance documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning covers the whole history, not only the last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitadapt/privacy... build
      - name: Dependency audit (fails on high/critical)
        run: pnpm security:audit
      - name: Secret scanning (gitleaks, pinned and checksum-verified)
        run: pnpm security:secrets
      - name: Static analysis (security rules, all errors)
        run: pnpm security:sast
      - name: Compliance documents
        run: pnpm compliance:check

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitadapt
          POSTGRES_PASSWORD: fitadapt-dev-only
          POSTGRES_DB: fitadapt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fitadapt -d fitadapt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fitadapt:fitadapt-dev-only@127.0.0.1:5432/fitadapt_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:integration
