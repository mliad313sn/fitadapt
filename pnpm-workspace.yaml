packages:
  - apps/*
  - packages/*
  - tooling/*

# React Native / Metro and jest-expo resolve packages from a flat node_modules
# tree; see ADR-001 ("pnpm with the hoisted node linker").
nodeLinker: hoisted

# pnpm 10 blocks dependency lifecycle scripts by default; allow only the ones we need.
onlyBuiltDependencies:
  - esbuild

# Next.js pulls sharp (LGPL-licensed libvips binaries) as an optional dependency for
# image optimisation. The coach portal stub uses no images; keep it out (L6, ADR-001).
ignoredOptionalDependencies:
  - sharp
